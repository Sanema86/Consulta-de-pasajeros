<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#424BE0"><title>CHOFER info</title>
<style>
/* ===== Base de la página ===== */
:root {
  font-family: Arial,sans-serif;
  color: #17231f;
  background: #f3f6f4;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}

/* ===== Cabecera ===== */
.top {
  background: #424BE0;
  color: white;
  padding: 18px 16px 14px;
}
.brand {
  font-size: 20px;
  font-weight: 700;
}
.sub {
  font-size: 12px;
  opacity: .8;
  margin-top: 4px;
}

/* ===== Pestañas Paraná / Santa Fe ===== */
.tabs {
  display: flex;
  background: #fff;
  padding: 6px;
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 2;
  box-shadow: 0 2px 8px #0001;
}
.tab {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 12px 6px;
  background: #e8eaf9;
  color: #2f36a8;
  font-weight: 700;
}
.tab.active {
  background: #424BE0;
  color: #fff;
}

/* ===== Fecha y botón Actualizar ===== */
.tools {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
}
.tools input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ccd8d1;
  border-radius: 8px;
  padding: 10px;
  background: white;
  font-size: 15px;
  
}
.refresh {
  border: 0;
  border-radius: 8px;
  background: #424BE0;
  color: white;
  padding: 11px 14px;
  font-weight: 700;
}

/* ===== Filtrar por ===== */
.filter {
  display: flex;
  gap: 8px;
  padding: 0 14px 10px;
}
.filter select, .filter input {
  border: 1px solid #ccd8d1;
  border-radius: 8px;
  padding: 10px 10px;
  background: white;
  font-size: 15px;
  min-width: 0;
}
.filter select {
  flex: 1.2;
}
.filter input {
  flex: 1;
}
.filter input:disabled {
  background: #eef2ef;
}

/* ===== Estado de la actualización ===== */
.status {
  padding: 0 15px 10px;
  color: #65756e;
  font-size: 12px;
}

/* ===== Tabla de servicios ===== */
.head, .service {
  display: grid;
  grid-template-columns: 54px 58px 1fr 48px 48px;
  gap: 5px;
  align-items: center;
  padding: 10px 12px;
}
.head {
  font-size: 10px;
  text-transform: uppercase;
  color: #75847d;
  font-weight: 700;
  border-bottom: 1px solid #dce5df;
}
.service {
  background: #fff;
  border-bottom: 1px solid #edf1ee;
  font-size: 13px;
}
.time {
  font-size: 15px;
  font-weight: 700;
  color: #424BE0;
}
.svc {
  font-weight: 700;
}
.car {
  color: #596b63;
}
.num {
  text-align: center;
  font-weight: 700;
  color: #90EE90;
}
.available {
  color: #008f39;
}
.empty {
  text-align: center;
  padding: 35px 20px;
  color: #75847d;
}

/* ===== Pie de página ===== */
.foot {
  text-align: center;
  padding: 18px;
  color: #8a9891;
  font-size: 11px;
}
</style></head><body>
<header class="top"><div class="brand">Info para choferes</div><div class="sub">Control de servicios</div></header>
<nav class="tabs"><button class="tab active" id="tab1" onclick="setDirection(1)">Paraná</button><button class="tab" id="tab2" onclick="setDirection(2)">Santa Fe</button></nav>
<div class="tools"><input id="date" type="date"><button class="refresh" onclick="loadServices(true)">↻ Actualizar</button></div>
<div class="filter"><select id="fby" aria-label="Filtrar por"><option value="">Filtrar por: sin filtro</option><option value="car">Combi</option><option value="svc">Servicio</option></select><input id="fval" type="text" inputmode="numeric" placeholder="Número" disabled></div>
<div class="status" id="status">Preparando consulta…</div>
<div class="head"><span>Salida</span><span>Servicio</span><span>Combi</span><span>Ocup.</span><span>Libres</span></div>
<main id="list"><div class="empty">Conectando con Micronauta…</div></main><div class="foot">Actualización automática cada 5 minutos</div>
<script>
const PAGE='https://micronauta.dnsalias.net/usuario/yaviene/resultados.php?a=almagroup';
const API='https://micronauta.dnsalias.net/usuario/yaviene/cmd.php';
// Versión web (GitHub Pages): consulta a través del Worker. En la app Android se consulta directo.
const WORKER='https://almagroup-monitor.sanabriaemanuel86.workers.dev/';
const viaWorker=location.hostname.endsWith('github.io');
let direction=1, timer=null, lastData=[], fBy='', fVal='';
try{fBy=localStorage.getItem('fby')||'';fVal=localStorage.getItem('fval')||''}catch(e){}
const $=id=>document.getElementById(id);
function localDate(){const d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
$('date').value=localDate();
function setDirection(n){direction=n;$('tab1').classList.toggle('active',n===1);$('tab2').classList.toggle('active',n===2);loadServices(false)}
function setStatus(s){$('status').textContent=s}
async function obtainToken(){
 const r=await fetch(PAGE,{credentials:'include',cache:'no-store',referrer:PAGE}); if(!r.ok)throw new Error('No se pudo abrir la página pública ('+r.status+')');
 const html=await r.text();
 const patterns=[/token["'\s:=]+["']?([a-f0-9]{64})/i,/token\s*[:=]\s*["']([^"']+)["']/i,/name=["']token["'][^>]*value=["']([^"']+)["']/i,/value=["']([^"']+)["'][^>]*name=["']token["']/i];
 for(const p of patterns){const m=html.match(p);if(m&&m[1])return m[1]}
 const doc=new DOMParser().parseFromString(html,'text/html');
 const input=doc.querySelector('input[name="token"],input#token');if(input&&input.value)return input.value;
 throw new Error('La página respondió, pero no se pudo identificar automáticamente el token.');
}
async function loadServices(manual){
 const date=$('date').value||localDate();setStatus('Consultando Micronauta…');
 try{
  const origen=direction===1?1:2,destino=direction===1?2:1;let r;
  if(viaWorker){
   if(WORKER.includes('TU-USUARIO'))throw new Error('Falta configurar la dirección del Worker en index.html');
   r=await fetch(WORKER,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({fecha:date,origen,destino})});
  }else{
   const token=await obtainToken();
   const payload={action:'buscar_servicios',a:'almagroup',cantidadPasajeros:1,destino,fecha:date,origen,paradaSubida:0,token};
   r=await fetch(API,{method:'POST',mode:'cors',credentials:'include',cache:'no-store',referrer:PAGE,headers:{'Content-Type':'application/json','Accept':'*/*'},body:JSON.stringify(payload)});
  }
  if(!r.ok){const t=(await r.text().catch(()=>'')).replace(/<[^>]*>/g,' ').trim().slice(0,150);throw new Error('Micronauta respondió '+r.status+(t?': '+t:''));}
  const result=await r.json();if(!result.success||!Array.isArray(result.data))throw new Error(result.message||'Respuesta no válida');
  lastData=result.data;render(lastData,date);setStatus('Actualizado: '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' · '+lastData.length+' servicios');
 }catch(e){$('list').innerHTML='<div class="empty">'+escapeHtml(e.message)+'<br><br>Reintentá con ↻ Actualizar.</div>';setStatus('No se pudo actualizar');}
}
function render(data,date){
 const now=new Date();const today=date===localDate();
 let rows=data.slice().sort((a,b)=>String(a.salida).localeCompare(String(b.salida)));
 if(today){const mins=now.getHours()*60+now.getMinutes();rows=rows.filter(x=>{const p=String(x.salida).split(':');const t=Number(p[0])*60+Number(p[1]);return t>=mins||t>mins-60;});}
 const q=fVal.trim().toLowerCase();
 if(fBy&&q)rows=rows.filter(x=>(fBy==='car'?carOf(x):svcOf(x)).trim().toLowerCase()===q);
 if(!rows.length){$('list').innerHTML='<div class="empty">No hay servicios para mostrar.</div>';return}
 $('list').innerHTML=rows.map(x=>{const time=String(x.salida||'').slice(0,5);const car=carOf(x);return `<div class="service"><span class="time">${escapeHtml(time)}</span><span class="svc">${escapeHtml(svcOf(x))}</span><span class="car">${escapeHtml(car)}</span><span class="num">${escapeHtml(x.vendidos??'—')}</span><span class="num available">${escapeHtml(x.asientos_disponibles??'—')}</span></div>`}).join('');
}
function carOf(x){return x.coche===null||x.coche===undefined||String(x.coche).trim()===''?'Sin asignar':String(x.coche)}
function svcOf(x){return String(x.servicio??'—')}
function applyFilter(){$('fval').disabled=!fBy;try{localStorage.setItem('fby',fBy);localStorage.setItem('fval',fVal)}catch(_){}render(lastData,$('date').value||localDate())}
$('fby').value=fBy;$('fval').value=fVal;$('fval').disabled=!fBy;
$('fby').addEventListener('change',e=>{fBy=e.target.value;if(!fBy){fVal='';$('fval').value=''}else $('fval').focus();applyFilter()});
$('fval').addEventListener('input',e=>{fVal=e.target.value;applyFilter()});
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('date').addEventListener('change',()=>loadServices(false));
loadServices(false);timer=setInterval(()=>loadServices(false),300000);
</script></body></html>
